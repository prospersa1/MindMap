<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gemini Classifier Tester</title>
  <style>
    body { background: #08080f; color: #e6e6f0; font-family: system-ui, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
    h2 { font-size: 18px; margin-bottom: 4px; }
    p  { color: #5a5a78; font-size: 13px; margin-bottom: 24px; }
    label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #5a5a78; }
    input {
      display: block; width: 100%; margin: 6px 0 16px;
      background: #0e0e1a; border: 1px solid #1a1a2c; border-radius: 8px;
      color: #e6e6f0; padding: 10px 12px; font-size: 14px; outline: none;
    }
    input:focus { border-color: #1D9E75; }
    button {
      background: #1D9E75; color: #fff; border: none; border-radius: 8px;
      padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #17876a; }
    button:disabled { background: #1a2e28; color: #5a5a78; cursor: not-allowed; }
    #result {
      margin-top: 24px; background: #0e0e1a; border: 1px solid #1a1a2c;
      border-radius: 8px; padding: 16px; font-size: 13px; display: none;
    }
    .label-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .cat-badge {
      padding: 3px 10px; border-radius: 99px; font-weight: 700;
      font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    }
    .ok   { color: #1D9E75; }
    .fail { color: #D85A30; }
    pre { background: #12121e; border-radius: 6px; padding: 10px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; color: #9090b0; margin: 0; }
  </style>
</head>
<body>
  <h2>Gemini Classifier Tester</h2>
  <p>Tests the Netlify classification endpoint the extension now uses. No API key is exposed in this page.</p>

  <label>API Base URL</label>
  <input id="baseUrl" />

  <label>Test URL</label>
  <input id="url" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ" />

  <label>Test Page Title</label>
  <input id="title" value="Rick Astley - Never Gonna Give You Up (Official Video)" />

  <button id="btn" onclick="runTest()">Run Test</button>

  <div id="result"></div>

  <script>
    const VALID_CATEGORIES = ['learning','entertainment','social media','productivity','news','other'];
    const CAT_COLOR = {
      learning: '#1D9E75', entertainment: '#D85A30', 'social media': '#C44BE0',
      productivity: '#378ADD', news: '#EF9F27', other: '#7a7a8a',
    };

    function defaultBaseUrl() {
      if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        return window.location.origin;
      }
      return 'http://localhost:8888';
    }

    document.getElementById('baseUrl').value = defaultBaseUrl();

    async function runTest() {
      const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/+$/, '');
      const url = document.getElementById('url').value.trim();
      const title = document.getElementById('title').value.trim();
      const btn = document.getElementById('btn');
      const result = document.getElementById('result');

      if (!baseUrl) { alert('Enter the API base URL first.'); return; }

      btn.disabled = true;
      btn.textContent = 'Testing...';
      result.style.display = 'none';

      try {
        const t0 = Date.now();
        const res = await fetch(`${baseUrl}/api/classify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, title }),
        });
        const ms = Date.now() - t0;
        const data = await res.json();

        if (!res.ok) {
          result.innerHTML = `<div class="fail">x API error ${res.status}</div><pre>${JSON.stringify(data, null, 2)}</pre>`;
          result.style.display = 'block';
          return;
        }

        const raw = (data?.raw ?? '').trim().toLowerCase();
        const match = VALID_CATEGORIES.find(c => c === data?.category) ?? 'other';
        const color = CAT_COLOR[match];

        result.innerHTML = `
          <div class="label-row">
            <span class="ok">OK Endpoint works</span>
            <span style="color:#5a5a78;font-size:12px">${ms}ms · ${data?.model ?? 'unknown model'}</span>
          </div>
          <div class="label-row">
            <span style="color:#5a5a78;font-size:13px">Result:</span>
            <span class="cat-badge" style="background:${color}22;color:${color}">${match}</span>
          </div>
          <div style="color:#5a5a78;font-size:12px;margin:8px 0 4px">Model text: <em style="color:#9090b0">"${raw}"</em></div>
          <div style="color:#5a5a78;font-size:11px;margin:8px 0 4px">Response:</div>
          <pre>${JSON.stringify(data, null, 2)}</pre>`;
        result.style.display = 'block';

      } catch (err) {
        result.innerHTML = `<div class="fail">x Network error</div><pre>${err.message}</pre>`;
        result.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run Test';
      }
    }
  </script>
</body>
</html>
